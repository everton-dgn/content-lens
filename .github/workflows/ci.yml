name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Install pinned actionlint
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint

      - name: Validate workflow syntax
        run: /tmp/actionlint

      - name: Install pinned kingfisher
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/kingfisher.tar.gz \
            https://github.com/mongodb/kingfisher/releases/download/v1.110.0/kingfisher-linux-x64.tgz
          echo "f55296fe4c6090c27963b2f62f5938e90b187ab1357466c8661d3786f6be7f14  /tmp/kingfisher.tar.gz" | sha256sum --check
          tar -xzf /tmp/kingfisher.tar.gz -C /tmp kingfisher

      - name: Scan the working tree for secrets
        run: PATH="/tmp:${PATH}" pnpm scan:secrets

      - name: Run local CI gate
        run: pnpm ci:local

      - name: Enforce the documented performance budgets
        run: pnpm benchmark

      # The lane renders the packaged bundle through the preview fixture, so it
      # needs a build of its own: the browser matrix below builds later.
      - name: Build the Chrome bundle the visual lane renders
        run: pnpm build:chrome

      - name: Run the visual regression lane
        run: pnpm test:visual

      - name: Run complete browser matrix
        run: pnpm test:browser

      - name: Package development build once
        run: pnpm release:package -- --channel dev --output .release/ci-build

      - name: Inspect release archives
        run: pnpm release:guard -- --directory .release/ci-build

      - name: Run narrow production-package journey
        run: pnpm test:browser:packaged
