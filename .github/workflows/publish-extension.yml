name: Publish extension

on:
  workflow_call:
    inputs:
      version:
        description: Exact package version without v prefix
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version without v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-extension-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify selected stable release again
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: read
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: v${{ inputs.version }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Download exact stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "v$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease \
            --jq '.isDraft or .isPrerelease')" = false
          mkdir -p release
          gh release download "v$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release

      - name: Verify manifest version, digests and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(jq -r '.product.version' release/release-manifest.json)" = "$RELEASE_VERSION"
          node scripts/release/verify-provenance.mjs \
            --directory release \
            --repository "$GITHUB_REPOSITORY" \
            --require-attestation

      - name: Freeze verified store-submission assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: content-lens-store-submission-${{ inputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 1

  chrome:
    name: Submit verified Chrome package
    needs: verify
    if: vars.CHROME_STORE_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: chrome-web-store
    permissions:
      attestations: read
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Check out submission code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: v${{ inputs.version }}

      - name: Authenticate to Google Cloud without a private key
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Download exact stable release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: content-lens-store-submission-${{ inputs.version }}
          path: release

      - name: Verify package attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "release/content-lens-$RELEASE_VERSION-chrome.zip" --repo "$GITHUB_REPOSITORY"

      - name: Query Chrome Web Store before upload
        id: status
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: |
          set -euo pipefail
          pnpm release:status -- --store chrome --version "$RELEASE_VERSION" > store-status.json
          decision="$(jq -r '.decision' store-status.json)"
          case "$decision" in
            already-present|blocked|eligible) ;;
            *)
              echo "Unexpected Chrome store decision: $decision" >&2
              exit 1
              ;;
          esac
          echo "decision=$decision" >> "$GITHUB_OUTPUT"

      - name: Submit staged Chrome package
        if: steps.status.outputs.decision == 'eligible'
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: |
          pnpm release:submit:chrome -- \
            --extension-id "$CWS_EXTENSION_ID" \
            --publisher-id "$CWS_PUBLISHER_ID" \
            --zip "release/content-lens-$RELEASE_VERSION-chrome.zip"

      - name: Record idempotent Chrome completion
        if: steps.status.outputs.decision == 'already-present'
        run: echo "Chrome Web Store already contains this version; no upload was attempted."

  amo:
    name: Submit verified Firefox package
    needs: verify
    if: vars.FIREFOX_STORE_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: amo
    permissions:
      attestations: read
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Check out submission code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: v${{ inputs.version }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Download exact stable release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: content-lens-store-submission-${{ inputs.version }}
          path: release

      - name: Verify package attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "release/content-lens-$RELEASE_VERSION-firefox.zip" --repo "$GITHUB_REPOSITORY"

      - name: Query AMO before upload
        id: status
        env:
          AMO_EXTENSION_ID: ${{ vars.AMO_EXTENSION_ID }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          pnpm release:status -- --store amo --version "$RELEASE_VERSION" > store-status.json
          decision="$(jq -r '.decision' store-status.json)"
          case "$decision" in
            already-present|blocked|eligible) ;;
            *)
              echo "Unexpected AMO decision: $decision" >&2
              exit 1
              ;;
          esac
          echo "decision=$decision" >> "$GITHUB_OUTPUT"

      - name: Submit listed Firefox package
        if: steps.status.outputs.decision == 'eligible'
        env:
          AMO_EXTENSION_ID: ${{ vars.AMO_EXTENSION_ID }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          pnpm exec wxt submit \
            --firefox-channel listed \
            --firefox-extension-id "$AMO_EXTENSION_ID" \
            --firefox-jwt-issuer "$AMO_JWT_ISSUER" \
            --firefox-jwt-secret "$AMO_JWT_SECRET" \
            --firefox-sources-zip "release/content-lens-$RELEASE_VERSION-sources.zip" \
            --firefox-zip "release/content-lens-$RELEASE_VERSION-firefox.zip"

      - name: Record idempotent AMO completion
        if: steps.status.outputs.decision == 'already-present'
        run: echo "AMO already contains this version; no upload was attempted."
