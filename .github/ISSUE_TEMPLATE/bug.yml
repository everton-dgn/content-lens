name: Documentation or behavior bug
description: Report a reproducible problem in documentation or a released build.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here. Follow SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release version or commit SHA where the problem exists.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: State the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Remove credentials, personal browsing data and private URLs.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Explain who is affected and whether data, privacy or compatibility is at risk.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This report contains no secret or private browsing data.
          required: true
