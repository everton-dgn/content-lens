  brace-expansion: "1.1.18"
  # GHSA-7p8r-x3mc-p8w7: host confusion via a backslash authority introducer.
  # Reached only through commitlint's schema validator, so development only.
  fast-uri: "3.1.5"
  js-yaml: "4.3.1"
  nanoid: "3.3.17"
  shell-quote: "1.9.0"
  tmp: "0.2.7"
  uuid: "11.1.1"
patchedDependencies:
  image-size@2.0.2: patches/image-size-2.0.2.patch
