name: Publish extension

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Verified release-candidate workflow run ID
        required: true
        type: string
      version:
        description: Exact package version without v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-extension-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify selected candidate again
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: read
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download exact candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: content-lens-release-candidate
          path: release
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Verify manifest version, digests and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(jq -r '.product.version' release/release-manifest.json)" = "$RELEASE_VERSION"
          node scripts/release/verify-provenance.mjs \
            --directory release \
            --repository "$GITHUB_REPOSITORY" \
            --require-attestation

  chrome:
    name: Submit verified Chrome package
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: chrome-web-store
    permissions:
      attestations: read
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Check out submission code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Download exact candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: content-lens-release-candidate
          path: release
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Verify package attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "release/content-lens-$RELEASE_VERSION-chrome.zip" --repo "$GITHUB_REPOSITORY"

      - name: Query Chrome Web Store before upload
        id: status
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_SERVICE_ACCOUNT_EMAIL: ${{ secrets.CWS_SERVICE_ACCOUNT_EMAIL }}
          CWS_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: |
          pnpm release:status -- --store chrome --version "$RELEASE_VERSION" > store-status.json
          echo "decision=$(jq -r '.decision' store-status.json)" >> "$GITHUB_OUTPUT"

      - name: Submit staged Chrome package
        if: steps.status.outputs.decision == 'eligible'
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_SERVICE_ACCOUNT_EMAIL: ${{ secrets.CWS_SERVICE_ACCOUNT_EMAIL }}
          CWS_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: |
          pnpm exec wxt submit \
            --chrome-api-version v2 \
            --chrome-extension-id "$CWS_EXTENSION_ID" \
            --chrome-publisher-id "$CWS_PUBLISHER_ID" \
            --chrome-service-account-client-email "$CWS_SERVICE_ACCOUNT_EMAIL" \
            --chrome-service-account-private-key "$CWS_SERVICE_ACCOUNT_PRIVATE_KEY" \
            --chrome-publish-type STAGED_PUBLISH \
            --chrome-zip "release/content-lens-$RELEASE_VERSION-chrome.zip"

      - name: Record idempotent Chrome completion
        if: steps.status.outputs.decision == 'already-present'
        run: echo "Chrome Web Store already contains this version; no upload was attempted."

  amo:
    name: Submit verified Firefox package
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: amo
    permissions:
      attestations: read
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Check out submission code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Download exact candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: content-lens-release-candidate
          path: release
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Verify package attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "release/content-lens-$RELEASE_VERSION-firefox.zip" --repo "$GITHUB_REPOSITORY"

      - name: Query AMO before upload
        id: status
        env:
          AMO_EXTENSION_ID: ${{ secrets.AMO_EXTENSION_ID }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          pnpm release:status -- --store amo --version "$RELEASE_VERSION" > store-status.json
          echo "decision=$(jq -r '.decision' store-status.json)" >> "$GITHUB_OUTPUT"

      - name: Submit listed Firefox package
        if: steps.status.outputs.decision == 'eligible'
        env:
          AMO_EXTENSION_ID: ${{ secrets.AMO_EXTENSION_ID }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          pnpm exec wxt submit \
            --firefox-channel listed \
            --firefox-extension-id "$AMO_EXTENSION_ID" \
            --firefox-jwt-issuer "$AMO_JWT_ISSUER" \
            --firefox-jwt-secret "$AMO_JWT_SECRET" \
            --firefox-sources-zip "release/content-lens-$RELEASE_VERSION-sources.zip" \
            --firefox-zip "release/content-lens-$RELEASE_VERSION-firefox.zip"

      - name: Record idempotent AMO completion
        if: steps.status.outputs.decision == 'already-present'
        run: echo "AMO already contains this version; no upload was attempted."
